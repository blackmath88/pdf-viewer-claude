<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1723" />
  <meta name="description" content="bridge-pdf — a private PDF reader that installs from the browser. Open, look, share, hand off. Your documents never leave your device." />
  <title>bridge-pdf</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <link rel="preload" href="./fonts/hanken-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/archivo-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Top toolbar -->
  <header class="toolbar" id="toolbar">
    <div class="toolbar__group toolbar__group--start">
      <span class="brand">
        <span class="brand__dot" aria-hidden="true"></span>
        <span class="brand__name">bridge-pdf</span>
      </span>
    </div>

    <div class="toolbar__group toolbar__group--doc" id="docTitleWrap" hidden>
      <span class="doc-title" id="docTitle" title=""></span>
    </div>

    <div class="toolbar__group toolbar__group--end">
      <button class="btn btn--ghost" id="installBtn" type="button" hidden aria-label="Install app">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        <span class="btn__label">Install</span>
      </button>
      <button class="btn btn--ghost btn--icon" id="shareBtn" type="button" hidden aria-label="Share" title="Share">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 16V4"/><path d="m8 8 4-4 4 4"/></svg>
      </button>
      <button class="btn btn--primary" id="openBtn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        <span class="btn__label">Open</span>
      </button>
    </div>
  </header>

  <!-- Reading surface -->
  <main class="stage" id="stage" tabindex="-1">
    <!-- Empty / welcome state -->
    <section class="welcome" id="welcome">
      <div class="welcome__card" id="dropzone">
        <div class="welcome__icon" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="64" height="64" aria-label="bridge-work">
            <rect x="5" y="5" width="43.5" height="43.5" rx="1.5" fill="#1a7a6d"/>
            <rect x="51.5" y="5" width="43.5" height="43.5" rx="1.5" fill="#3d1f47"/>
            <rect x="5" y="51.5" width="43.5" height="43.5" rx="1.5" fill="#3d1f47"/>
            <path d="M51.5 95 Q51.5 51.5 95 51.5 L95 95 Z" fill="#2a8fa0"/>
          </svg>
        </div>
        <h1 class="welcome__title">bridge-pdf</h1>
        <p class="welcome__text">Open a PDF, glance at it, share it, hand its text to an LLM. It stays on your device — nothing is uploaded.</p>
        <button class="btn btn--primary btn--lg" id="welcomeOpenBtn" type="button">Choose a PDF</button>
        <p class="welcome__hint" id="welcomeHint">or drop a file anywhere on this screen</p>
      </div>

      <!-- Strip divider — canonical separator between hero and Recents -->
      <div class="strip" id="strip" role="presentation" hidden>
        <i class="seg--teal"></i><i class="seg--purple"></i><i class="seg--teald"></i><i class="seg--purple"></i><i class="seg--teal"></i><i class="seg--purplem"></i><i class="seg--teald"></i><i class="seg--purple"></i><i class="seg--accent"></i><i class="seg--purple"></i><i class="seg--teal"></i><i class="seg--teald"></i><i class="seg--purple"></i><i class="seg--teald"></i>
      </div>

      <!-- Recent documents (stored on-device) -->
      <div class="recents" id="recents" hidden>
        <div class="recents__head">
          <span class="recents__title">Recent</span>
          <button class="recents__clear" id="recentsClear" type="button">Clear all</button>
        </div>
        <ul class="recents__list" id="recentsList"></ul>
      </div>
    </section>

    <!-- Loading state -->
    <div class="overlay" id="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p class="overlay__text" id="loadingText">Opening document&hellip;</p>
    </div>

    <!-- Error state -->
    <div class="overlay overlay--error" id="errorState" hidden>
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      <p class="overlay__text" id="errorText">Something went wrong.</p>
      <button class="btn btn--ghost" id="errorDismiss" type="button">Dismiss</button>
    </div>

    <!-- Rendered page -->
    <div class="canvas-scroll" id="canvasScroll" hidden>
      <div class="page-holder" id="pageHolder">
        <canvas id="pageCanvas"></canvas>
        <div class="textLayer" id="textLayer"></div>
      </div>
    </div>

    <!-- Drag highlight -->
    <div class="drag-veil" id="dragVeil" aria-hidden="true">
      <div class="drag-veil__inner">Drop to open</div>
    </div>
  </main>

  <!-- Bottom controls -->
  <nav class="controls" id="controls" hidden aria-label="Document controls">
    <div class="controls__group">
      <button class="ctl" id="prevBtn" type="button" aria-label="Previous page" title="Previous (←)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="pager">
        <input class="pager__input" id="pageInput" type="text" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="Page number" />
        <span class="pager__sep">/</span>
        <span class="pager__total" id="pageTotal">1</span>
      </div>
      <button class="ctl" id="nextBtn" type="button" aria-label="Next page" title="Next (→)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <div class="controls__divider" aria-hidden="true"></div>

    <div class="controls__group">
      <button class="ctl" id="zoomOutBtn" type="button" aria-label="Zoom out" title="Zoom out (−)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="ctl ctl--wide" id="fitBtn" type="button" aria-label="Fit width" title="Fit width (0)">
        <span id="zoomLabel">Fit</span>
      </button>
      <button class="ctl" id="zoomInBtn" type="button" aria-label="Zoom in" title="Zoom in (+)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg>
      </button>
    </div>

    <div class="controls__divider" aria-hidden="true"></div>

    <div class="controls__group">
      <button class="ctl" id="rotateBtn" type="button" aria-label="Rotate clockwise" title="Rotate (R)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button class="ctl" id="fsBtn" type="button" aria-label="Fullscreen" title="Fullscreen (F)">
        <svg class="icon-expand" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <svg class="icon-collapse" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
    </div>
  </nav>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />

  <!-- Share sheet -->
  <div class="sheet" id="shareSheet" hidden>
    <div class="sheet__backdrop" id="shareBackdrop"></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="Share">
      <div class="sheet__handle" aria-hidden="true"></div>
      <h2 class="sheet__title">Share</h2>
      <button class="sheet__item" id="sharePdfBtn" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/><path d="M14 2v6h6"/></svg>
        <span class="sheet__item-text"><strong>Share PDF</strong><small>Send the original file</small></span>
      </button>
      <button class="sheet__item" id="shareImgBtn" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-4 4-2-2-7 7"/></svg>
        <span class="sheet__item-text"><strong>Share this page as image</strong><small>PNG of the page you're viewing</small></span>
      </button>

      <p class="sheet__label">Hand off to an LLM</p>
      <button class="sheet__item" id="copyTextBtn" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M6 15a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2"/></svg>
        <span class="sheet__item-text"><strong>Copy all text</strong><small>Whole document to the clipboard</small></span>
      </button>
      <button class="sheet__item" id="downloadMdBtn" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 2h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/><path d="M8 13h1.5l1.5 2 1.5-2H14"/><path d="M8 17V13M14 13v4"/></svg>
        <span class="sheet__item-text"><strong>Download as .md</strong><small>Markdown, with headings</small></span>
      </button>

      <button class="sheet__cancel" id="shareCancel" type="button">Cancel</button>
    </div>
  </div>

  <!-- Toast for transient hints -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
